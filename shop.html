<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop All Products — Voltix</title>
  <link rel="stylesheet" href="style.css">
  <script src="products.js"></script>
  <script src="script.js"></script>
  <script src="chatbot.js"></script>
</head>
<body data-page="shop">
  <div class="page-banner">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a><span>/</span><span id="bc-current" style="margin:0;color:inherit">Shop</span></div>
      <h1 id="page-title">All Products</h1>
    </div>
  </div>

  <main>
    <div class="container shop-layout">
      <input type="checkbox" id="filters-toggle" class="filters-toggle-input">
      <label for="filters-toggle" class="filters-toggle-btn">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
        Filters
      </label>
      <aside class="filters">
        <h4>Filters</h4>
        <div class="filter-group">
          <div class="f-title">Category</div>
          <div id="filter-cats"></div>
        </div>
        <div class="filter-group">
          <div class="f-title">Price range (₹)</div>
          <div class="price-inputs">
            <input type="number" id="price-min" min="0" placeholder="Min" aria-label="Minimum price in rupees">
            <span>—</span>
            <input type="number" id="price-max" min="0" placeholder="Max" aria-label="Maximum price in rupees">
          </div>
        </div>
        <div class="filter-group">
          <div class="f-title">Brand</div>
          <div id="filter-brands" class="filter-scroll"></div>
        </div>
        <div class="filter-group">
          <div class="f-title">Rating</div>
          <div class="filter-option"><input type="radio" name="rating" id="r0" value="0" checked><label for="r0">Any rating</label></div>
          <div class="filter-option"><input type="radio" name="rating" id="r1" value="4"><label for="r1">★★★★☆ &amp; up</label></div>
          <div class="filter-option"><input type="radio" name="rating" id="r2" value="4.5"><label for="r2">★★★★★ 4.5 &amp; up</label></div>
        </div>
        <button class="button" type="button" id="apply-filters" style="width:100%;">Apply filters</button>
      </aside>

      <div>
        <div class="shop-toolbar">
          <span id="shop-count">Loading products…</span>
          <select id="sort-select" aria-label="Sort products">
            <option value="featured">Sort: Featured</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="new">Newest first</option>
            <option value="rating">Top rated</option>
            <option value="discount">Biggest discount</option>
          </select>
        </div>
        <div class="chip-row" id="active-chips"></div>

        <!-- Products are rendered by app.js from the live product APIs -->
        <div class="shop-products" id="shop-grid"></div>

        <nav class="pagination" id="pagination" aria-label="Product pages"></nav>
      </div>
    </div>
  </main>
</body>
</html>
